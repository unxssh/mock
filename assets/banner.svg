<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141517" />
      <stop offset="50%" stop-color="#1a1b1e" />
      <stop offset="100%" stop-color="#0f1012" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28292d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e1f23" stop-opacity="0.65" />
    </linearGradient>

    <radialGradient id="radialGlow" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; font-size: 64px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.04em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 20px; font-weight: 400; fill: #949ba4; letter-spacing: -0.01em; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 13px; font-weight: 500; fill: #dcddde; }
    .pill { fill: #26272b; stroke: rgba(255, 255, 255, 0.12); stroke-width: 1; rx: 14; }
  </style>

  <rect width="1200" height="400" fill="url(#bgGrad)" rx="20" />
  <rect width="1200" height="400" fill="url(#radialGlow)" rx="20" />
  <rect width="1198" height="398" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" rx="19" />

  <rect x="250" y="45" width="700" height="310" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#cardShadow)" />

  <g transform="translate(565, 80) scale(2.8)">
    <path fill="#FFFFFF" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.94.04-2.03.64-2.69 1.41-.58.68-1.1 1.75-.96 2.8 1.05.08 2.13-.56 2.73-1.34z"/>
  </g>

  <text x="600" y="225" text-anchor="middle" class="title">mock</text>
  <text x="600" y="262" text-anchor="middle" class="subtitle">a minimal space gray theme for vesktop &amp; vencord</text>

  <g transform="translate(370, 292)">
    <rect x="0" y="0" width="130" height="28" class="pill" />
    <text x="65" y="18" text-anchor="middle" class="tag">minimal ui</text>

    <rect x="145" y="0" width="160" height="28" class="pill" />
    <text x="225" y="18" text-anchor="middle" class="tag">space gray</text>

    <rect x="320" y="0" width="140" height="28" class="pill" />
    <text x="390" y="18" text-anchor="middle" class="tag">vesktop &amp; vencord</text>
